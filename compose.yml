# chatahub/docker-compose.yml

services:
  app:
    build: .
    command: sh -c "rm -f tmp/pids/server.pid && ./bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    # env_file načíta API kľúče (Stripe/Twilio/weather) z .env; required:false => beží aj bez neho
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
    # condition: service_healthy => app nabehne až keď sú závislosti reálne pripravené (nie len spustené)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  sidekiq:
    build: .
    command: bundle exec sidekiq
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Rebuilds Tailwind CSS on every file change
  css:
    build: .
    command: bin/rails tailwindcss:watch[always]
    volumes:
      - .:/app
    environment:
      RAILS_ENV: development

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
  #    ports:
  #      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
